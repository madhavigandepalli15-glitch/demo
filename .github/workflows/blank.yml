name: MuleSoft CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Java 17
      # mule-artifact.json requires Java 17
      - name: Set Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Build Mule application
      - name: Build Mule App
        run: mvn clean package -e

      # Step 4: Deploy Mule application to CloudHub 2.0
      - name: Deploy Mule App
        run: |
          mvn clean deploy -DmuleDeploy \
            -Danypoint.client.id="${{ secrets.ANYPOINT_CLIENT_ID }}" \
            -Danypoint.client.secret="${{ secrets.ANYPOINT_CLIENT_SECRET }}"
